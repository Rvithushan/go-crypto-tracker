<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Go Crypto Tracker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
            background-color: #0f172a;
            color: #f8fafc;
        }
        .card {
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            display: inline-block;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3);
            min-width: 320px;
            border: 1px solid #334155;
        }
        input[type="text"] {
            padding: 10px;
            width: 200px;
            border: 1px solid #475569;
            border-radius: 6px;
            background: #0f172a;
            color: white;
        }
        button {
            padding: 10px 15px;
            background-color: #3b82f6;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #2563eb;
        }
        .price {
            font-size: 1.8em;
            color: #34d399;
            margin: 15px 0;
        }
        .pod-badge {
            margin-top: 25px;
            padding: 8px 12px;
            background-color: #334155;
            border-radius: 20px;
            font-size: 0.85em;
            color: #94a3b8;
            display: inline-block;
        }
        .error {
            color: #f87171;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Crypto Tracker</h1>

        <!-- Search Form -->
        <form action="/" method="GET">
            <input type="text" name="asset" placeholder="e.g. bitcoin, ethereum, solana..." required>
            <button type="submit">Track Price</button>
        </form>

        {{if .Error}}
            <p class="error">{{.Error}}</p>
        {{else}}
            {{if .Crypto}}
                <h2>{{.Crypto}}</h2>
                <div class="price">{{.Price}}</div>
            {{end}}
        {{end}}

        <!-- Pod Identity Display -->
        <div class="pod-badge">
            Served by: <strong>{{.PodName}}</strong>
        </div>
    </div>
</body>
</html>
